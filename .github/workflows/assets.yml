name: Update WordPress.org readme and artwork

# Runs when readme.txt or the .wordpress-org artwork changes on main.
# Updates only the directory listing text and images; it never ships plugin code.
on:
  push:
    branches:
      - main
    paths:
      - "readme.txt"
      - ".wordpress-org/**"

jobs:
  assets:
    name: Push readme and artwork to the plugin directory
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Update readme and assets on WordPress.org SVN
        uses: 10up/action-wordpress-plugin-asset-update@stable
        env:
          SVN_USERNAME: pugboy
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: threshold-easy-downloader
          IGNORE_OTHER_FILES: true
